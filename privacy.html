<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخصوصية | مِرآة المشروع</title><style>body{background:#07090d;color:#eee;font:18px Arial;line-height:1.9;max-width:800px;margin:60px auto;padding:20px}a{color:#63f6b2}</style><h1>الخصوصية</h1><p>مِرآة المشروع في هذا الإصدار يحلل صفحات عامة يطلبها المستخدم فقط. لا نحاول تجاوز تسجيل الدخول أو الحماية. لا نطلب كلمات مرور المواقع المستهدفة.</p><p>نتائج التحليل تُعرض للمستخدم، ويمكن تخزينها محليًا في الإصدارات المستقبلية ضمن حسابه.</p><a href="/">العودة</a>
