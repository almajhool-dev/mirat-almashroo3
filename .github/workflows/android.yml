name: Android Build
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: TikTok-Creator-Toolkit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiktok-toolkit-${{ github.run_number }}
          name: TikTok Creator Toolkit build ${{ github.run_number }}
          body: Automated debug APK build from the Android source in this repository.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
